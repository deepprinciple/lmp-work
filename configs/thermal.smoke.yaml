run:
  build_system: true
  write_input: true
  run_lammps: true
  analyze: true

job:
  type: thermal_conductivity
  method: rnemd

analysis:
  method: rnemd

case:
  smiles: "CO"
  name: "methanol_smoke"
  workdir: "./cases/methanol_thermal_smoke"

structure:
  output_formats:
    - "xyz"
    - "pdb"

model:
  n_molecules: 32
  density_g_cm3: 0.7918
  packmol_density_scale: 0.85
  packmol_tolerance_A: 2.0
  packmol_seed: 20260401
  packmol_max_attempts: 3
  packmol_seed_step: 17
  packmol_nloop: 100
  packmol_full_box: false
  packmol_margin_A: null
  packmol_strict: false

forcefield:
  engine: "openff"
  version: "openff-2.0.0"
  strict_stereo: true
  charge_method: "am1bcc"
  charge_fallback: "gasteiger"
  use_cache: true

simulation:
  equil_input_filename: "in.equil.lammps"
  temperature_K: 298.15
  seed: 20260401
  timestep_fs: 0.5
  n_replicas: 1
  replica_seed_base: 410000
  replica_seed_step: 1
  replica_decorrelation_steps: 2000
  npt_pre_50_steps: 1000
  npt_pre_10_steps: 1000
  npt_1atm_steps: 3000
  nvt_steps: 3000
  fit_sample_steps: 5000
  parallel_replicas: false

lammps:
  executable: "/opt/lammps/bin/lmp"
  mpi_command: "mpirun"
  mpi_ranks: 1
  allow_run_as_root: true
  use_gpu: false
  gpu_count: 0
  omp_threads: 1
  equil_log_file: "run_equil.log"
  use_hwthread_cpus: false

visualization:
  render_last_frame: false

thermal_rnemd:
  box_aspect_ratio: [1.0, 1.0, 3.0]
  replica_dir_prefix: "thermal_conductivity/method_rnemd/replica_"
  replica_input_filename: "in.thermal.lammps"
  replica_log_prefix: "../../../thermal_replica"
  run_steps: 5000
  edim: "z"
  nbin: 20
  swap_every_steps: 50
  nswap: 1
  profile_every_steps: 5
  profile_repeat: 20
  profile_freq: 100
  profile_file: "temp_profile.dat"
  exchange_file: "thermal_exchange.dat"
  thermo_file: "thermal_rnemd_thermo.dat"
  plateau_start_ps: 0.5
  swap_buffer_bins: 2
  kappa_rel_std_tol: 0.5
  kappa_drift_tol: 0.5
  min_window_points: 3
  summary_file: "thermal_summary.json"
  profile_plot_file: "thermal_profile.png"
  kappa_plot_file: "thermal_kappa.png"
  batch_summary_file: "thermal_results.json"
