# ================================================================
# BAMBOO Green-Kubo viscosity workflow configuration
# Usage: python md_viscosity.py --config configs/viscosity.yaml
# ================================================================

run:
  build_system: true
  write_input:  true
  run_lammps:   true
  run_equil:    true
  run_gk:       true
  analyze:      true

case:
  name:     "LiPF6_EC_DMC"
  workdir:  "./cases/lipf6_ec_dmc_viscosity"

components:
  # Solvents use RDKit geometries plus OpenFF AM1-BCC charges. Ions use the
  # preset geometries/charges in forcefields/ions.py.
  - { name: EC,  kind: solvent, smiles: "C1COC(=O)O1", charge_source: openff_am1bcc }
  - { name: DMC, kind: solvent, smiles: "COC(=O)OC",   charge_source: openff_am1bcc }
  - { name: Li,  kind: cation,  preset: "Li+" }
  - { name: PF6, kind: anion,   preset: "PF6-" }

composition:
  mode: counts
  counts:
    EC:  182
    DMC: 182
    Li:  14
    PF6: 14

model:
  density_g_cm3:          1.24
  packmol_density_scale:  0.85
  packmol_tolerance_A:    2.0
  packmol_seed:           20260415
  packmol_max_attempts:   5
  packmol_seed_step:      17
  packmol_nloop:          200
  packmol_full_box:       false
  packmol_margin_A:       null
  packmol_strict:         false

bamboo:
  # Local developer-machine path to ByteDance BAMBOO's paper_new_disp.pt.
  # GPU suppliers must change this to the model path on their own machine.
  # This value is rendered directly into the LAMMPS pair_coeff line.
  model_file:             "/root/bamboo/benchmark/paper_new_disp.pt"
  # BAMBOO example defaults: pair_style bamboo 5.0 5.0 10.0 1
  pair_style_args:        [5.0, 5.0, 10.0, 1]
  pppm_accuracy:          1.0e-6
  # Keep this consistent with the target system size and BAMBOO/LAMMPS build.
  pppm_mesh:              [64, 64, 64]
  data_file:              "in.data"
  build_report_file:      "build_report.json"
  neutrality_tolerance:   1.0e-3

simulation:
  temperature_K:    300.0
  pressure_atm:     1.0
  # Use 1 fs for this demo: the BAMBOO example input runs with timestep 1.
  timestep_fs:      1.0
  seed:             20260415
  minimize:         true
  thermo_every:     1000

  # Equilibration.
  nvt_steps:        40000
  npt_steps:        200000
  final_nvt_steps:  20000
  npt_thermo_file:  "npt_thermo.dat"
  equil_density_check_last_steps: 50000
  equil_density_rel_tol: 0.05
  equil_skip_density_check: false
  equil_temp_check_last_steps: 10000
  equil_temp_abs_tol_K: 15.0
  equil_skip_temperature_check: false

  # Green-Kubo production (NVE).
  # This demo runs one production length only. Increase/decrease this value
  # directly when changing the GPU validation wall time.
  prod_steps:       2000000
  # Maximum ACF lag in samples for stress_acf.dat.
  corr_length:      40000
  # Pressure tensor and ACF sampling stride in MD steps.
  sample_every:     1

  equil_input_filename: "in.equil.lammps"
  equil_restart_file:   "equil_nvt.restart"
  gk_input_filename:    "in.gk.lammps"
  acf_file:             "stress_acf.dat"
  pressure_file:        "pressure_tensor.dat"
  pressure_every:       1
  thermo_file:          "gk_thermo.dat"
  equil_log_file:       "run_equil.log"
  gk_log_file:          "run_gk.log"

lammps:
  # Must resolve to the BAMBOO-enabled LAMMPS executable, not a stock LAMMPS.
  executable:         "lmp_mpi"
  mpi_command:        "mpirun"
  mpi_ranks:          1
  allow_run_as_root:  true
  use_hwthread_cpus:  false
  oversubscribe:      false
  kokkos:             true
  kokkos_gpus:        1
  suffix:             "kk"
  extra_args:         []
  env:
    # Developer-machine BAMBOO LAMMPS path. GPU suppliers should replace this
    # with their own BAMBOO build output directory.
    PATH: "/root/bamboo/pair/lammps/output:${PATH}"

analysis:
  # pressure_blocks is the main post-processing path for non-smoke runs:
  # it uses pressure_tensor.dat, block ACFs, running eta, and block SEM.
  method:             "pressure_blocks"
  # Maximum correlation lag used by the Green-Kubo integral.
  t_max_ps:           20.0
  # Length of each independent pressure block. Must be larger than t_max_ps.
  block_size_ps:      200.0
  min_blocks:         3
  # Earliest integration time considered for selecting the viscosity window.
  plateau_start_ps:   5.0
  plateau_end_ps:     null
  auto_plateau:       true
  auto_window_ps:     10.0
  auto_step_ps:       1.0
  min_window_ps:      10.0
  rel_std_tol:        0.25
  drift_tol:          0.25
  require_stable_window: false
  smooth_window:      11
  summary_file:       "viscosity_summary.json"
  plot_file:          "viscosity_analysis.png"
  running_file:       "viscosity_running.csv"
  blocks_file:        "viscosity_blocks.csv"
