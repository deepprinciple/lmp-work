run:
  build_system: true
  write_input: true
  run_lammps: false
  analyze: false
case:
  smiles: CCO
  name: ethanol_500mol_viscosity_squarebox_negk_opls_lbcc_20260407
  workdir: /root/lmp-work/.compat/opls_runlmp_dryrun_ethanol
structure:
  output_formats:
  - xyz
model:
  n_molecules: 500
  density_g_cm3: 0.78522
  packmol_density_scale: 0.85
  packmol_tolerance_A: 2.0
  packmol_seed: 20260507
  packmol_max_attempts: 5
  packmol_seed_step: 17
  packmol_nloop: 200
  packmol_full_box: false
  packmol_margin_A: null
  packmol_strict: false
forcefield:
  engine: ligpargen
  charge_method: CM1A-LBCC
  input_mode: generated_pdb
  residue_name: MOL
  n_optimizations: 0
  wrapper_script: /root/lmp-work/.compat/bin/ligpargen_local.sh
  debug: false
  notes: Native LigParGen/BOSS CM1A-LBCC route. For neutral molecules this already
    includes the 1.14 scaling.
simulation:
  equil_input_filename: in.equil.lammps
  replica_input_filename: in.replica.lammps
  replica_dir_prefix: replica_
  n_replicas: 3
  replica_seed_base: 20265507
  replica_seed_step: 11
  replica_decorrelation_steps: 200000
  temperature_K: 298.15
  seed: 20260507
  timestep_fs: 0.5
  npt_pre_50_steps: 200000
  npt_pre_10_steps: 300000
  npt_1atm_steps: 1000000
  nvt_steps: 1000000
  gk_steps: 2000000
  acf_sample_every_steps: 5
  acf_corr_points: 8000
  parallel_replicas: false
equilibration_policy:
  mode: fixed_long_run
qc:
  tail_fraction: 0.5
  target_density_g_cm3: 0.78522
  npt_temperature_mean_tol: 0.02
  npt_temperature_std_tol: 0.05
  npt_density_mean_tol: 0.05
  npt_density_std_tol: 0.01
  npt_density_drift_tol: 0.01
  nvt_temperature_mean_tol: 0.02
  nvt_temperature_std_tol: 0.05
  nvt_temperature_drift_tol: 0.02
  nvt_energy_key: etotal
  nvt_energy_fluctuation_tol: 0.01
lammps:
  executable: /opt/lammps/bin/lmp
  mpi_command: mpirun
  mpi_ranks: 8
  allow_run_as_root: true
  use_gpu: false
  gpu_count: 0
  omp_threads: 1
  equil_log_file: run_equil.log
  replica_log_prefix: run_replica
  use_hwthread_cpus: true
visualization:
  render_last_frame: false
analysis:
  hfacf_file: hfacf.dat
  vacf_file: vacf.dat
  gk_data_file: gk_data.dat
  output: result.csv
  visc_t_max_ps: 20.0
  kappa_t_max_ps: 20.0
  visc_plateau_start_ps: 5.0
  kappa_plateau_start_ps: 2.0
  smooth_window: 50
  n_blocks: 5
  save_diagnostics: true
benchmark:
  viscosity_target_cP: 1.263
  thermal_target_W_mK: 0.1618471934536164
  reference_temperature_C: 25.0
  notes: Square-box OPLS/LigParGen NEGK validation for ethanol
dielectric:
  enabled: false
  source_file: gk_data.dat
  notes: Reserved for future dielectric-constant support after the OPLS viscosity
    branch is evaluated.
