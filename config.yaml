run:
  build_system: true
  write_input: true
  run_lammps: true
  analyze: true

case:
  smiles: "C1CCOC1"
  name: "thf_thermal_only"
  workdir: "./cases/thf_thermal_only"

structure:
  output_formats:
    - "xyz"
    - "pdb"

model:
  n_molecules: 500
  density_g_cm3: 0.889
  packmol_density_scale: 0.85
  packmol_tolerance_A: 2.0
  packmol_seed: 20260407
  packmol_max_attempts: 5
  packmol_seed_step: 17
  packmol_nloop: 200
  packmol_full_box: false
  packmol_margin_A: null
  packmol_strict: false

forcefield:
  engine: "openff"
  version: "openff-2.0.0"
  strict_stereo: true
  charge_method: "am1bcc"
  charge_fallback: "gasteiger"
  use_cache: true

simulation:
  equil_input_filename: "in.equil.lammps"
  temperature_K: 298.15
  seed: 20260407
  timestep_fs: 0.5
  n_replicas: 1
  replica_seed_base: 207000
  replica_seed_step: 11
  replica_decorrelation_steps: 0
  npt_pre_50_steps: 0
  npt_pre_10_steps: 0
  npt_1atm_steps: 100000
  nvt_steps: 200000
  fit_sample_steps: 2000000
  parallel_replicas: false

lammps:
  executable: "/opt/lammps/bin/lmp"
  mpi_command: "mpirun"
  mpi_ranks: 4
  allow_run_as_root: true
  use_gpu: false
  gpu_count: 0
  omp_threads: 1
  equil_log_file: "run_thermal_case_equil.log"
  use_hwthread_cpus: true

visualization:
  render_last_frame: false

thermal_rnemd:
  box_aspect_ratio: [1.0, 1.0, 3.0]
  replica_dir_prefix: "thermal_conductivity/method_rnemd/replica_"
  replica_input_filename: "in.thermal_rnemd.lammps"
  replica_log_prefix: "../../../run_thermal_case_replica"
  run_steps: 2000000
  edim: "z"
  nbin: 20
  swap_every_steps: 100
  nswap: 1
  profile_every_steps: 10
  profile_repeat: 100
  profile_freq: 1000
  profile_file: "temp_profile.dat"
  exchange_file: "thermal_exchange.dat"
  thermo_file: "thermal_rnemd_thermo.dat"
  plateau_start_ps: 50.0
  swap_buffer_bins: 2
  kappa_rel_std_tol: 0.15
  kappa_drift_tol: 0.15
  min_window_points: 5
  summary_file: "thermal_rnemd_summary.json"
  profile_plot_file: "thermal_profile_latest.png"
  kappa_plot_file: "thermal_kappa_running.png"
  batch_summary_file: "thermal_rnemd_results.json"
