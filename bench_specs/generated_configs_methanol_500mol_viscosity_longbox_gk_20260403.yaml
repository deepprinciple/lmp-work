run:
  write_input: true
  run_lammps: true
  analyze: true

source:
  equil_workdir: /root/lmp-work/bench_runs/methanol_500mol_thermal_rnemd_longbox_20260403
  equil_restart_name: equil_nvt.restart
  system_data_name: system.data

case:
  workdir: /root/lmp-work/bench_runs/methanol_500mol_thermal_rnemd_longbox_20260403/viscosity

forcefield:
  engine: openff

simulation:
  replica_input_filename: in.replica.lammps
  replica_dir_prefix: method_gk/replica_
  replica_log_file: run_longbox_viscosity_replica1.log
  temperature_K: 298.15
  replica_seed: 670001
  replica_decorrelation_steps: 0
  timestep_fs: 0.5
  gk_steps: 100000
  fit_sample_steps: 2000000
  acf_sample_every_steps: 5
  acf_corr_points: 12000

lammps:
  executable: /opt/lammps/bin/lmp
  mpi_command: mpirun
  mpi_ranks: 24
  allow_run_as_root: true
  use_gpu: false
  gpu_count: 0
  omp_threads: 1
  use_hwthread_cpus: true

analysis:
  hfacf_file: hfacf.dat
  vacf_file: vacf.dat
  gk_data_file: gk_data.dat
  output: result.csv
  summary_json: viscosity_longbox_summary.json
  visc_t_max_ps: 30.0
  kappa_t_max_ps: 20.0
  visc_plateau_start_ps: 5.0
  kappa_plateau_start_ps: 2.0
  visc_plateau_end_ps: null
  kappa_plateau_end_ps: null
  smooth_window: 11
  n_blocks: 4
  save_diagnostics: true

visualization:
  render_last_frame: false
